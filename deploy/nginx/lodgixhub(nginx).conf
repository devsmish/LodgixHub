server {
    listen 80;
    server_name _;  # нет домена — принимаем запросы по любому Host (по IP EC2)

    client_max_body_size 20M;  # загрузка фото листингов (apps/content) — дефолт 1M мал

    # Django admin и статика собранная через collectstatic
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # media НЕ отдаём через nginx — она в S3 и раздаётся напрямую оттуда
    # (см. Этап 6, django-storages сформирует прямые S3-ссылки в API-ответах)

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # health-check endpoint, если у тебя нет своего /health/ — Django ответит и на /
    location = /health/ {
        proxy_pass http://web:8000;
        access_log off;
    }
}
