services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: lodgixhub-web:prod
    restart: unless-stopped
    env_file:
      - .env.aws.example
    volumes:
      - static_data:/app/staticfiles
      # media НЕ монтируем как volume в проде — файлы едут напрямую в S3
      # (django-storages/boto3, настраивается в settings.py через USE_S3)
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      # - "443:443"   # раскомментировать после настройки TLS (certbot)
    volumes:
      - ./deploy/nginx/lodgixhub.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro

volumes:
  static_data:
