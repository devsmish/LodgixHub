services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: lodgixhub-web:prod
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.aws
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: lodgixhub-web:prod
    restart: unless-stopped
    entrypoint: []
    command: celery -A config worker -l info
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.aws
    volumes:
      - media_data:/app/media

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: lodgixhub-web:prod
    restart: unless-stopped
    entrypoint: []
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.aws

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./deploy/nginx/lodgixhub.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro

volumes:
  static_data:
  media_data:
  redis_data:
