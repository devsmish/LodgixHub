services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ${MYSQL_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - D:/DB/LodgixHub_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: lodgixhub-web:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - ENV_FILE=.env.docker
    ports:
      - "7000:8000"
    volumes:
      - .:/app
      - media_data:/app/media

volumes:
  media_data: